name: Minna field-kit tests

on:
  push:
    branches: [main]
    paths:
      - "minna-field-kit/**"
      - ".github/workflows/field-kit-tests.yml"
  pull_request:
    paths:
      - "minna-field-kit/**"
      - ".github/workflows/field-kit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-kit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: minna-field-kit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Content, guides, text, and report tests
        run: python -m unittest tests.test_content tests.test_guides tests.test_text tests.test_hand_built -v

      - name: Statistical tests
        run: python -m unittest tests.test_stats -v

      - name: Pipeline tests
        run: python -m unittest tests.test_pipeline -v
