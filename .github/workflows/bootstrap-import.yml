name: Import Minna source bundle

on:
  push:
    branches: [main]
    paths:
      - "source-archives/minna-source.tar.xz"

permissions:
  contents: write

jobs:
  import-source:
    # This bootstrap workflow is intentionally restricted to the repository owner.
    if: github.actor == 'looloofy69-sketch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and import bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="source-archives/minna-source.tar.xz"
          test -s "$bundle"

          # Reject absolute paths, parent traversal, and unexpected top-level roots.
          tar -tJf "$bundle" > "${RUNNER_TEMP}/minna-members.txt"
          python3 - <<'PY'
          from pathlib import Path
          members = Path("${RUNNER_TEMP}/minna-members.txt").read_text().splitlines()
          allowed = ("minna/", "minna-field-kit/")
          if not members:
              raise SystemExit("Archive is empty")
          for name in members:
              path = Path(name)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe archive member: {name!r}")
              if not name.startswith(allowed):
                  raise SystemExit(f"Unexpected archive root: {name!r}")
          PY

          tmp="${RUNNER_TEMP}/minna-source-import"
          mkdir -p "$tmp"
          tar -xJf "$bundle" -C "$tmp"
          test -f "$tmp/minna/README.md"
          test -f "$tmp/minna-field-kit/README.md"

          # Avoid overwriting an existing code import without an explicit review.
          test ! -e ./minna
          test ! -e ./minna-field-kit
          cp -a "$tmp/minna" ./minna
          cp -a "$tmp/minna-field-kit" ./minna-field-kit
          rm -rf source-archives

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import Minna source packages"
          git push
