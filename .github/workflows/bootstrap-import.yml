name: Bootstrap source import

on:
  push:
    branches: [main]
    paths:
      - "source-archives/minna-source.tar.xz"

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s source-archives/minna-source.tar.xz
          tar -tJf source-archives/minna-source.tar.xz
          tmp="${RUNNER_TEMP}/minna-source-import"
          mkdir -p "$tmp"
          tar -xJf source-archives/minna-source.tar.xz -C "$tmp"
          test -f "$tmp/minna/README.md"
          test -f "$tmp/minna-field-kit/README.md"
          # Preserve package roots and directory boundaries from both uploaded ZIPs.
          cp -a "$tmp/minna" ./minna
          cp -a "$tmp/minna-field-kit" ./minna-field-kit
          rm -rf source-archives
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import Minna source packages"
          git push
