name: Bootstrap source import

on:
  push:
    branches: [main]
    paths:
      - "source-archives/IMPORT_READY"

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s source-archives/IMPORT_READY
          test -s source-archives/chunks/part-000.b64
          tmp="${RUNNER_TEMP}/minna-source-import"
          mkdir -p "$tmp"
          cat source-archives/chunks/part-*.b64 | tr -d '\r\n' | base64 --decode > "$tmp/minna-source.tar.xz"
          tar -tJf "$tmp/minna-source.tar.xz"
          mkdir -p "$tmp/extracted"
          tar -xJf "$tmp/minna-source.tar.xz" -C "$tmp/extracted"
          test -f "$tmp/extracted/minna/README.md"
          test -f "$tmp/extracted/minna-field-kit/README.md"
          # Preserve package roots and directory boundaries from the uploaded archives.
          cp -a "$tmp/extracted/minna" ./minna
          cp -a "$tmp/extracted/minna-field-kit" ./minna-field-kit
          rm -rf source-archives
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import Minna source packages"
          git push
