# NOT YET EXECUTED: written in a sandbox that could not reach Maven Central. Treat the first run as part of M0 acceptance.
name: ci
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests (plain JVM, no Android SDK)
        run: gradle :core:test --console=plain
      - name: Gate and market math (assertions inside)
        run: |
          python3 scripts/minna_gates.py
          python3 scripts/minna_math.py
